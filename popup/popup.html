<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Manager</title>
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1>TAB MANAGER</h1>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="icon-btn" data-i18n-attr="title:themeToggle, aria-label:themeToggle">
        <i data-icon="sun-moon"></i>
      </button>
      <button type="button" id="refresh" class="icon-btn" data-i18n-attr="title:refresh, aria-label:refresh">
        <i data-icon="refresh-cw"></i>
      </button>
    </div>
  </header>

  <section class="stats" id="stats" aria-live="polite"></section>

  <div class="search-field">
    <i class="search-icon" data-icon="search"></i>
    <input type="search" id="search" autocomplete="off" data-i18n-attr="placeholder:searchPlaceholder, aria-label:searchTabs">
  </div>

  <section class="duplicates" id="duplicates"></section>

  <section class="actions">
    <button type="button" id="clean" class="primary">
      <i data-icon="eraser"></i><span data-i18n="cleanDuplicates">Clean Duplicates</span>
    </button>
    <button type="button" id="close-all-dupes">
      <i data-icon="trash"></i><span data-i18n="closeAllDuplicates">Close All Duplicate Tabs</span>
    </button>
    <button type="button" id="open-dashboard">
      <i data-icon="layout-dashboard"></i><span data-i18n="openDashboard">Open Dashboard</span>
    </button>
  </section>

  <p class="status" id="status" role="status"></p>

  <script type="module" src="popup.js"></script>
</body>
</html>
