<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tab Manager</title>
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1>TAB MANAGER</h1>
      <button type="button" id="theme-toggle" class="icon-btn" data-i18n-attr="title:themeToggle, aria-label:themeToggle">
        <i data-icon="sun-moon"></i>
      </button>
      <button type="button" id="open-help" class="icon-btn" data-i18n-attr="title:help, aria-label:help">
        <i data-icon="circle-question-mark"></i>
      </button>
      <button type="button" id="open-settings" class="icon-btn" data-i18n-attr="title:settings, aria-label:settings">
        <i data-icon="settings"></i>
      </button>
    </div>
    <div class="header-actions">
      <button type="button" id="refresh"><i data-icon="refresh-cw"></i><span data-i18n="refresh">Refresh</span></button>
      <button type="button" id="collapse-all"><i data-icon="chevrons-down-up"></i><span data-i18n="collapseAll">Collapse all</span></button>
      <button type="button" id="clean" class="primary"><i data-icon="eraser"></i><span data-i18n="cleanDuplicates">Clean Duplicates</span></button>
      <button type="button" id="close-all-dupes" class="danger"><i data-icon="trash"></i><span data-i18n="closeAllDuplicates">Close All Duplicate Tabs</span></button>
    </div>
  </header>

  <section class="stats" id="stats" aria-live="polite"></section>

  <section class="toolbar">
    <div class="search-field">
      <i class="search-icon" data-icon="search"></i>
      <input type="search" id="search" autocomplete="off" data-i18n-attr="placeholder:searchPlaceholder, aria-label:searchTabs">
    </div>
    <div class="filters" id="filters" role="group" data-i18n-attr="aria-label:filter.label"></div>
    <label class="group-mode">
      <span data-i18n="groupBy">Group by</span>
      <select id="group-mode" data-i18n-attr="aria-label:groupBy">
        <option value="domain" data-i18n="groupBy.domain">Domain</option>
        <option value="window" data-i18n="groupBy.window">Window</option>
        <option value="spreadsheet" data-i18n="groupBy.spreadsheet">Google Sheets file</option>
      </select>
    </label>
  </section>

  <section class="bulkbar" id="bulkbar" hidden>
    <span id="bulk-count"></span>
    <button type="button" id="bulk-close" class="danger"><i data-icon="trash"></i><span data-i18n="bulk.close">Close Selected</span></button>
    <button type="button" id="bulk-move"><i data-icon="move-right"></i><span data-i18n="bulk.move">Move Selected</span></button>
    <button type="button" id="bulk-clear"><i data-icon="x"></i><span data-i18n="bulk.clear">Clear</span></button>
  </section>

  <main class="groups" id="groups"></main>

  <p class="status" id="status" role="status"></p>

  <dialog id="settings-dialog">
    <button type="button" class="dialog-close" data-close="settings-dialog" data-i18n-attr="title:action.close, aria-label:action.close"><i data-icon="x"></i></button>
    <form method="dialog" class="settings-form">
      <h2 data-i18n="settings.title">Settings</h2>

      <label>
        <span data-i18n="settings.duplicateHandling">Duplicate handling</span>
        <select id="set-rule">
          <option value="keep-active" data-i18n="settings.keepActive">Keep Active tab</option>
          <option value="keep-newest" data-i18n="settings.keepNewest">Keep Newest tab</option>
          <option value="keep-oldest" data-i18n="settings.keepOldest">Keep Oldest tab</option>
        </select>
      </label>

      <label>
        <span data-i18n="settings.theme">Theme</span>
        <select id="set-theme">
          <option value="system" data-i18n="settings.themeSystem">System</option>
          <option value="light" data-i18n="settings.themeLight">Light</option>
          <option value="dark" data-i18n="settings.themeDark">Dark</option>
        </select>
      </label>

      <label>
        <span data-i18n="settings.language">Language</span>
        <select id="set-locale">
          <option value="auto" data-i18n="settings.langAuto">Auto (browser language)</option>
          <option value="en" data-i18n="settings.langEn">English</option>
          <option value="vi" data-i18n="settings.langVi">Tiếng Việt</option>
        </select>
      </label>

      <label class="checkbox">
        <input type="checkbox" id="set-ignore-tab-id">
        <span data-i18n="settings.ignoreTabId">Ignore the sheet / page / slide a Google tab is on</span>
      </label>

      <label class="checkbox">
        <input type="checkbox" id="set-warning">
        <span data-i18n="settings.warning">Warn when a Google Sheet is already open</span>
      </label>

      <label class="checkbox">
        <input type="checkbox" id="set-autoclose">
        <span data-i18n="settings.autoclose">Automatically close duplicates</span>
      </label>
      <p class="hint" data-i18n="settings.hint">Off by default - the extension only reports duplicates.</p>

      <menu class="dialog-actions">
        <button type="button" id="settings-reset" class="danger" data-i18n="settings.reset">Reset</button>
        <button type="submit" id="settings-save" class="primary" data-i18n="settings.save">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="move-dialog">
    <button type="button" class="dialog-close" data-close="move-dialog" data-i18n-attr="title:action.close, aria-label:action.close"><i data-icon="x"></i></button>
    <h2 data-i18n="moveToWindow">Move to window</h2>
    <div class="picker" id="move-list"></div>
    <menu class="dialog-actions">
      <button type="button" id="move-cancel" data-close="move-dialog" data-i18n="action.cancel">Cancel</button>
      <button type="button" id="move-confirm" class="primary" data-i18n="action.confirm">Confirm</button>
    </menu>
  </dialog>

  <dialog id="help-dialog">
    <button type="button" class="dialog-close" data-close="help-dialog" data-i18n-attr="title:action.close, aria-label:action.close"><i data-icon="x"></i></button>
    <article class="help-body">
      <h2><i data-icon="circle-question-mark"></i><span data-i18n="help.title">Usage guide</span></h2>
      <p data-i18n="help.intro"></p>
      <ul>
        <li data-i18n="help.badge"></li>
        <li data-i18n="help.popup"></li>
        <li data-i18n="help.dashboard"></li>
        <li data-i18n="help.groups"></li>
        <li data-i18n="help.clean"></li>
        <li data-i18n="help.sheets"></li>
        <li data-i18n="help.settings"></li>
      </ul>
      <menu class="dialog-actions">
        <button type="button" id="help-close" class="primary" data-i18n="action.close">Close</button>
      </menu>
    </article>
  </dialog>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
